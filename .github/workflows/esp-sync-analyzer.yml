name: ESP Sync offline analyzer tests

on:
  push:
    branches:
      - feature/anti-aim-analyzer
    paths:
      - tools/analyze_esp_sync.py
      - src/foundation/math/camera_prediction.hpp
      - tools/tests/camera_prediction_test.cpp
      - tools/tests/test_analyze_esp_sync.py
      - .github/workflows/esp-sync-analyzer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Passive CSV analyzer unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run synthetic timing tests
        run: python -m unittest discover -s tools/tests -p 'test_analyze_esp_sync.py' -v
      - name: Check analyzer Python syntax
        run: python -m py_compile tools/analyze_esp_sync.py

  camera-prediction:
    name: Camera lookahead C++23 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile pure prediction policy
        run: g++ -std=c++23 -O2 -Wall -Wextra -Werror -Isrc tools/tests/camera_prediction_test.cpp -o /tmp/vesta-camera-prediction-test
      - name: Check clamps and fallbacks
        run: /tmp/vesta-camera-prediction-test
